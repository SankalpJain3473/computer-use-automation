name: Deploy to Hugging Face Spaces

# Needs the repository secret HF_TOKEN (a Hugging Face write token) and the
# repository variable HF_SPACE (e.g. your-hf-username/computer-use-automation).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the Space tree
        run: |
          mkdir ../space
          git archive HEAD | tar -x -C ../space
          cd ../space
          rm -rf .github docs
          find . \( -name '*.png' -o -name '*.pdf' \) -delete
          {
            printf -- '---\n'
            printf 'title: Computer-Use Automation\n'
            printf 'emoji: 🏦\n'
            printf 'colorFrom: blue\n'
            printf 'colorTo: gray\n'
            printf 'sdk: docker\n'
            printf 'app_port: 7860\n'
            printf 'pinned: false\n'
            printf -- '---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd ../space
          git init -q -b main
          git config user.name "deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
