name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Start the target app
        run: |
          npm run target-app > target-app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/login > /dev/null && exit 0
            sleep 1
          done
          cat target-app.log
          exit 1

      - name: Scenario catalog
        run: npm run scenarios

      - name: Build the deploy image
        run: docker build -t computer-use-automation .

      - name: Smoke-test the deploy image
        run: |
          docker run -d --name app -p 7860:7860 -e AGENT_API_KEY=ci-agent -e OPERATOR_API_KEY=ci-operator computer-use-automation
          for i in $(seq 1 60); do
            if curl -sf -H "Authorization: Bearer ci-agent" http://localhost:7860/api/capabilities > /dev/null; then
              curl -sf -H "Authorization: Bearer ci-agent" -H "Content-Type: application/json" \
                -d '{"params":{"memberId":"12345"}}' \
                http://localhost:7860/api/capabilities/lookup_member_balance/invoke | tee result.json
              grep -q '"COMPLETED"' result.json && exit 0
              break
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-report
          path: |
            evidence/scenarios-*/
            target-app.log
          if-no-files-found: ignore
